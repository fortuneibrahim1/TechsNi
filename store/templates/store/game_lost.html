<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Game Over</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white d-flex align-items-center justify-content-center min-vh-100">
    <div class="card bg-danger text-white p-4 shadow text-center" style="max-width: 500px; width: 100%;">
        <h3>😢 Oh No!</h3>
        <p class="lead mt-2">{{ message }}</p>
        <p class="small text-light">Thanks for playing! You've used your turn for this cycle.</p>
        <a href="{% url 'portal_gateway' %}" class="btn btn-light fw-bold text-danger mt-3">Return to Gateway</a>
    </div>
</body>
</html>
