<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us - TechsNi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
    body { background: #121212; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px; }
    .card { background: #1a1a1a; border: 1px solid #4a1015; border-radius: 10px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); color: #ffffff; }
    h1 { color: #ff4d4d; font-weight: bold; }
    p, li, span { color: #ffffff !important; }
    .text-muted { color: #ffffff !important; opacity: 0.9; }
    a.btn-back { background: #b30000; color: white; border: none; }
    a.btn-back:hover { background: #cc0000; color: white; }
</style>
</head>
<body>
    <div class="container mt-5" style="max-width: 800px;">
        <div class="card">
            <h1>About TechsNi</h1>
            <p class="text-muted">Services & Store Portal Management System</p>
            <hr class="border-secondary">
            
            <!-- Dynamic About text from database SiteConfiguration -->
            <div class="my-3">
                {{ config.about_text|safe }}
            </div>

            <!-- Optional PDF view/download button if an About PDF was uploaded -->
            {% if config.about_pdf %}
            <div class="mt-4 mb-3">
                <a href="{{ config.about_pdf.url }}" target="_blank" class="btn btn-danger">
                    <i class="bi bi-file-earmark-pdf-fill me-2"></i> Download / View About Us PDF
                </a>
            </div>
            {% endif %}

            <div class="mt-4">
                <a href="{% url 'login' %}" class="btn btn-back">Back to Login</a>
            </div>
        </div>
    </div>
</body>
</html>
