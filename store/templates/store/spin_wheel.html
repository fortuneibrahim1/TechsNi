<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TechsNi Spin Wheel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white d-flex align-items-center justify-content-center min-vh-100">
    <div class="card bg-secondary text-white p-4 shadow text-center" style="max-width: 500px; width: 100%;">
        <h3 class="mb-3">🎡 Spin the Wheel</h3>
        <p class="text-light mb-4">Choose a slice to test your luck and win a discount reward!</p>
        
        <form method="POST">
            {% csrf_token %}
            <div class="d-grid gap-2 mb-3">
                {% for opt in wheel_options %}
                    <button type="submit" name="option_id" value="{{ opt.id }}" class="btn btn-outline-light py-2 fw-bold">
                        {{ opt.label }}
                    </button>
                {% endfor %}
            </div>
        </form>
        <a href="{% url 'portal_gateway' %}" class="text-white small text-decoration-underline mt-2">Return to Gateway</a>
    </div>
</body>
</html>
