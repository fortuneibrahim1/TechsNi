<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>General TechsNi Policy - TechsNi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .policy-text-box {
            white-space: pre-line;
            line-height: 1.8;
            font-size: 1rem;
            color: #ffffff;
        }
    </style>
</head>
<body class="bg-dark text-white">
    <div class="container mt-5 mb-5" style="max-width: 800px;">
        <div class="card bg-secondary text-white shadow border-secondary">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0">General TechsNi Policy</h4>
            </div>
            <div class="card-body p-4">
                <p class="text-light opacity-75">TechsNi Official Guidelines</p>
                <hr class="border-secondary">
                
                <!-- Dynamic text with preserved spacing and line structure -->
                <div class="my-3 policy-text-box">
                    {{ config.policy_text }}
                </div>

                <!-- Optional PDF view/download button if a policy PDF was uploaded -->
                {% if config.policy_pdf %}
                <div class="mt-4 mb-3">
                    <a href="{{ config.policy_pdf.url }}" target="_blank" class="btn btn-danger fw-bold">
                        <i class="bi bi-file-earmark-pdf-fill me-2"></i> Download / View Official Policy PDF
                    </a>
                </div>
                {% endif %}

                <div class="mt-4">
                    <a href="{% url 'login' %}" class="btn btn-outline-light px-4">Back to Login</a>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
