{% extends 'store/base.html' %}

{% block title %}Delete Account - TechsNi Store{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow border-danger p-4 text-center">
            <h3 class="text-danger fw-bold mb-3">⚠️ Confirm Account Deletion</h3>
            <p class="text-muted mb-4">Are you sure you want to delete your account? This action is permanent and cannot be undone.</p>
            
            <form method="POST">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url 'user_profile' %}" class="btn btn-secondary px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4 fw-bold">Yes, Delete My Account</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
