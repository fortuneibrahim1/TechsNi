<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - TechsNi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a0003 0%, #080808 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        ::selection { background: #b30000; color: #ffffff; }
        .login-card {
            background: rgba(20, 20, 20, 0.95);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(138, 28, 20, 0.35);
            border: 1px solid rgba(138, 28, 20, 0.4);
            width: 420px;
            text-align: center;
        }
        label, h2, p { color: #ffffff !important; }
        input[type="text"] {
            width: 100%;
            padding: 11px 14px;
            background-color: #121212;
            border: 1px solid #4a1015;
            border-radius: 6px;
            color: #fff;
            text-align: center;
            letter-spacing: 4px;
            font-size: 20px;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #b30000 0%, #660000 100%);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 class="fw-bold mb-3">Enter OTP Code</h2>
        <p class="small opacity-75 mb-4">Enter the 6-digit verification code below to proceed with your password reset.</p>
        
        {% if request.session.password_reset_success_message %}
        <div class="alert alert-success py-2 small mb-3" style="background-color: #155724; color: #d4edda; border-color: #c3e6cb;">
            <strong>{{ request.session.password_reset_success_message }}</strong>
        </div>
        {% endif %}

        {% if error %}
        <div class="alert alert-danger py-2 small mb-3">{{ error }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group mb-3">
                <input type="text" name="otp_code" maxlength="6" placeholder="------" required autofocus>
            </div>
            <button type="submit" class="btn-submit">Verify Code</button>
        </form>
    </div>
</body>
</html>
