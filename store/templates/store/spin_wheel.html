<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spin the Wheel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .wheel-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto 20px auto;
        }
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid #ffc107;
            background: conic-gradient(
                #ff416c 0deg 90deg, 
                #ff4b2b 90deg 180deg, 
                #17a2b8 180deg 270deg, 
                #28a745 270deg 360deg
            );
            transition: transform 4s cubic-bezier(0.15, 0.90, 0.15, 1);
            position: relative;
        }
        .wheel-pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 25px solid #fff;
            z-index: 10;
        }
        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background: #212529;
            border: 4px solid #ffc107;
            border-radius: 50%;
            z-index: 5;
        }
    </style>
</head>
<body class="bg-dark text-white d-flex align-items-center justify-content-center min-vh-100 py-4">
    <div class="card p-4 bg-secondary text-white text-center shadow" style="max-width: 450px; width: 100%;">
        <h2 class="mb-2">🎡 TechsNi Spin Wheel</h2>
        <p class="text-light mb-4">Click spin to test your luck and win a discount code!</p>
        
        <!-- Visual Wheel Graphic -->
        <div class="wheel-container">
            <div class="wheel-pointer"></div>
            <div class="wheel" id="spinWheel">
                <div class="wheel-center"></div>
            </div>
        </div>

        <!-- Hidden form that gets submitted programmatically after spin -->
        <form method="POST" id="spinForm">
            {% csrf_token %}
            <!-- We pick a random option ID from the ones available in the backend -->
            <input type="hidden" name="option_id" id="selectedOptionId" value="">
            <button type="button" id="spinBtn" class="btn btn-warning w-100 fw-bold py-3 fs-5 text-dark shadow" onclick="startSpin()">
                SPIN THE WHEEL!
            </button>
        </form>

        <div class="mt-4">
            <a href="{% url 'portal_gateway' %}" class="text-white-50 text-decoration-none small">Back to Portal Gateway</a>
        </div>
    </div>

    <!-- Pass backend wheel options into JavaScript array -->
    <script>
        const wheelOptions = [
            {% for option in wheel_options %}
                { id: "{{ option.id }}", label: "{{ option.label|escapejs }}" },
            {% endfor %}
        ];

        function startSpin() {
            if (wheelOptions.length === 0) {
                alert("No spin options configured by admin!");
                return;
            }

            const spinBtn = document.getElementById('spinBtn');
            const wheel = document.getElementById('spinWheel');
            spinBtn.disabled = true;
            spinBtn.innerText = "Spinning...";

            const randomIndex = Math.floor(Math.random() * wheelOptions.length);
            const chosenOption = wheelOptions[randomIndex];
            document.getElementById('selectedOptionId').value = chosenOption.id;

            const degreesPerSegment = 360 / wheelOptions.length;
            const targetRotation = 1800 + (randomIndex * degreesPerSegment) + (degreesPerSegment / 2);

            wheel.style.transform = `rotate(${targetRotation}deg)`;

            setTimeout(() => {
                document.getElementById('spinForm').submit();
            }, 4100);
        }
    </script>
</body>
</html>
