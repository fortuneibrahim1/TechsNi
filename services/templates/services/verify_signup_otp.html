<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Account - TechsNi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a0003 0%, #080808 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        ::selection { background: #b30000; color: #ffffff; }
        .login-card {
            background: rgba(20, 20, 20, 0.95);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(138, 28, 20, 0.35);
            border: 1px solid rgba(138, 28, 20, 0.4);
            width: 420px;
            text-align: center;
        }
        label, h2, p { color: #ffffff !important; }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 500;
        }
        input[type="text"] {
            width: 100%;
            padding: 11px 14px;
            background-color: #121212;
            border: 1px solid #4a1015;
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            text-align: center;
            letter-spacing: 4px;
            font-size: 18px;
        }
        input:focus {
            outline: none;
            border-color: #ff1a1a;
            box-shadow: 0 0 8px rgba(255, 26, 26, 0.4);
            background-color: #161616;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #b30000 0%, #660000 100%);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(179, 0, 0, 0.4);
        }
        .btn-submit:hover {
            background: linear-gradient(135deg, #cc0000 0%, #800000 100%);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 class="fw-bold mb-3">Verify Your Account</h2>
        <p class="small opacity-75 mb-4">Enter the 6-digit verification code below to activate your account.</p>
        
        {% if request.session.signup_success_message %}
        <div class="alert alert-success py-2 small mb-3" style="background-color: #155724; color: #d4edda; border-color: #c3e6cb;">
            <strong>{{ request.session.signup_success_message }}</strong>
        </div>
        {% endif %}

        {% if error %}
        <div class="alert alert-danger py-2 small mb-3">{{ error }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="otp">OTP Code:</label>
                <input type="text" name="otp" id="otp" maxlength="6" placeholder="------" required autofocus>
            </div>

            <button type="submit" class="btn-submit">Verify Code</button>
        </form>

        <div class="mt-4">
            <a href="{% url 'login' %}" class="text-danger text-decoration-none fw-bold small">Back to Login</a>
        </div>
    </div>
</body>
</html>
