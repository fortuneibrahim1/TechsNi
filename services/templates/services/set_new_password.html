<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - TechsNi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a0003 0%, #080808 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-card {
            background: rgba(20, 20, 20, 0.95);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(138, 28, 20, 0.35);
            border: 1px solid rgba(138, 28, 20, 0.4);
            width: 420px;
            text-align: center;
        }
        label, h2, p { color: #ffffff !important; text-align: left; }
        input[type="password"] {
            width: 100%;
            padding: 11px 14px;
            background-color: #121212;
            border: 1px solid #4a1015;
            border-radius: 6px;
            color: #fff;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #b30000 0%, #660000 100%);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 class="fw-bold mb-3 text-center">New Password</h2>
        <p class="small opacity-75 mb-4 text-center">Please enter your new secure password below.</p>
        
        {% if error %}
        <div class="alert alert-danger py-2 small">{{ error }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small">New Password:</label>
                <input type="password" name="new_password" required>
            </div>
            <div class="mb-3">
                <label class="form-label small">Confirm Password:</label>
                <input type="password" name="confirm_password" required>
            </div>
            <button type="submit" class="btn-submit">Update Password</button>
        </form>
    </div>
</body>
</html>
